# Thinker Distillery — verify on merge requests, deploy from the default branch.
#
# Until 2026-09-22 this file held one job, gated to the default branch, so nothing whatsoever ran
# while a merge request was open. Every check in the repository ran after merge, and the only
# post-merge check was the deploy build. The checking scripts all exit non-zero correctly and
# nothing consumed the exit code: they were invoked by prose inside an agent's prompt, and the
# pipeline decided whether a page had passed its gates by reading two booleans the agent wrote
# about its own work. `verify` is where that stops being true.

image: oven/bun:1

stages:
  - verify
  - deploy

# Runs while the merge request is open, which is the only moment a failure is cheap.
verify:
  stage: verify
  script:
    - bun install --frozen-lockfile
    # The build first, because a page that does not compile makes every other failure noise.
    - bun run build
    # Then the gates, on every live page that is not on scripts/ledger-exempt.txt.
    - bun scripts/verify.ts
    # The workflow control flow, against stub agents. No model calls.
    - bun test scripts/test/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  stage: deploy
  script:
    - bun install --frozen-lockfile
    - bun run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
